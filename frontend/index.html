<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSECG2 — Gestion des Soutenances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/LOGOREELUCAD.png" type="image/png" />
</head>
<body class="login-page">
  <div class="bg-grid"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="brand-logo">
        <img src="img/LOGOREELUCAD.png" alt="UCAD Logo" width="56" height="56" style="border-radius: 8px; object-fit: contain; background: white;" />
      </div>
      <div>
        <h1 class="brand-title">Soutenance</h1>
        <p class="brand-sub">ESP-UCAD · DSECG2 · 2025/2026</p>
      </div>
    </div>

    <div class="login-card">
      <div class="login-card-header">
        <h2>Connexion</h2>
        <p>Accédez à votre espace de gestion</p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tab-login" class="auth-tab active">Connexion</button>
        <button type="button" id="tab-register" class="auth-tab">Inscription</button>
      </div>

      <div id="login-error" class="alert alert-error hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-error-msg">Erreur</span>
      </div>
      
      <div id="login-success" class="alert alert-success hidden" style="background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3); color: #4ade80;">
        <span id="login-success-msg">Succès</span>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">
        <div class="field-group">
          <label for="username">Identifiant</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="Entrez votre identifiant" required autocomplete="username" />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Voir le mot de passe">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-login" id="login-btn">
          <span class="btn-text">Se connecter</span>
          <div class="btn-spinner hidden"></div>
        </button>
      </form>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
